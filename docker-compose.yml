name: gridsentinel
x-python: &python
  build:
    context: .
    dockerfile: Dockerfile
  image: gridsentinel-python:local
  env_file: .env
  restart: unless-stopped
  init: true
  networks: [monitoring]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run python scripts/bootstrap.py first}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [monitoring]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  mqtt:
    image: eclipse-mosquitto:2
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD}
    entrypoint: [/bin/sh, /config/entrypoint.sh]
    volumes:
      - ./deploy/mosquitto:/config:ro
      - mqtt-data:/mosquitto/data
    ports: [127.0.0.1:1883:1883]
    networks: [monitoring]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'mosquitto_pub -h 127.0.0.1 -u "$$MQTT_USERNAME" -P "$$MQTT_PASSWORD" -t gridsentinel/health -m health -q 1']
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    <<: *python
    dns_opt: ["timeout:1", "attempts:1"]
    environment:
      MQTT_ENABLED: 'true'
      SCADA_HOST: scada
      SCADA_PORT: '1502'
      SCADA_PORT_BASE: ${SCADA_PORT_BASE:-1502}
      SCADA_BANK_SIZE: ${SCADA_BANK_SIZE:-247}
      SCADA_BANK_COUNT: ${SCADA_BANK_COUNT:-3}
    ports: [127.0.0.1:8000:8000]
    depends_on:
      db: {condition: service_healthy}
      mqtt: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 15
  simulator:
    <<: *python
    command: [python, -m, services.simulator.main]
    environment:
      API_URL: http://api:8000
      MQTT_HOST: mqtt
    depends_on:
      api: {condition: service_healthy}
      mqtt: {condition: service_healthy}
  scada:
    <<: *python
    command: [python, -m, services.scada_bridge.server]
    environment:
      API_URL: http://api:8000
      SCADA_HOST: 0.0.0.0
      SCADA_PORT: '1502'
      SCADA_PORT_BASE: ${SCADA_PORT_BASE:-1502}
      SCADA_BANK_SIZE: ${SCADA_BANK_SIZE:-247}
      SCADA_BANK_COUNT: ${SCADA_BANK_COUNT:-3}
    ports: ['127.0.0.1:${SCADA_PORT_BASE:-1502}-${SCADA_PORT_END:-1504}:${SCADA_PORT_BASE:-1502}-${SCADA_PORT_END:-1504}']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import socket,os; base=int(os.getenv('SCADA_PORT_BASE','1502')); [socket.create_connection(('localhost',base+i),3).close() for i in range(int(os.getenv('SCADA_BANK_COUNT','3')))]"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: '1'
    ports: [127.0.0.1:3000:3000]
    networks: [monitoring]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 15
networks:
  monitoring:
    driver: bridge
volumes:
  postgres-data:
  mqtt-data:
